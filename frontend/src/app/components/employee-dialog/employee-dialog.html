<p-dialog [header]="employee ? 'Edit Employee' : 'Add Employee'" [(visible)]="visible" (onHide)="onHide()"
  [modal]="true" [closable]="true" [style]="{width: '540px'}">
  <form [formGroup]="form" class="container-fluid">
    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label">First Name</label>
        <input pInputText formControlName="firstName" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Last Name</label>
        <input pInputText formControlName="lastName" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Email</label>
        <input pInputText formControlName="email" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Phone</label>
        <input pInputText formControlName="phone" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Department</label>
        <input pInputText formControlName="department" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Designation</label>
        <input pInputText formControlName="designation" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Salary</label>
        <input id="salary" type="number" pInputText formControlName="salary" class="form-control" />
      </div>

      <div class="col-6 mb-3">
        <label class="form-label">Joining Date</label>

        <p-datepicker formControlName="joiningDate" dateFormat="yy-mm-dd" [showIcon]="true" [appendTo]="'body'"
          placeholder="YYYY-MM-DD">
        </p-datepicker>
      </div>
    </div>
  </form>
  <ng-template #footer>

    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="onClose()">
    </p-button>

    <p-button [label]="employee ? 'Update' : 'Save'" icon="pi pi-check" [disabled]="form.invalid" (onClick)="onSave()">
    </p-button>

  </ng-template>
</p-dialog>
